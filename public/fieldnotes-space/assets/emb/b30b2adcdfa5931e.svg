<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 530" role="img" aria-labelledby="wafer-title wafer-desc"><title id="wafer-title">基板・ウェーハの工程と製品分岐</title><desc id="wafer-desc">高純度原料、単結晶成長、切断、仕上加工から、裸基板、エピ基板、SOI等に分岐しデバイスFabへ進む。</desc><defs><marker id="wafer-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1769aa"/></marker></defs><rect width="1160" height="530" fill="#fff"/><g font-family="Arimo, Noto Sans JP, sans-serif" fill="#173657"><text x="28" y="30" font-size="21" text-anchor="start" fill="#173657" font-weight="700">基板・ウェーハは「材料 → 結晶 → 表面・構造を整えた製品」</text><text x="28" y="55" font-size="14" text-anchor="start" fill="#536478">製品構造で分岐する。すべての基板がエピタキシャル成長を通るわけではない。</text><rect x="25" y="109" width="164" height="223" rx="3" fill="#f6f9fc" stroke="#9eb4c7"/><text x="107" y="136" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">高純度原料</text><path d="M199,218 H215" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><rect x="225" y="109" width="164" height="223" rx="3" fill="#f6f9fc" stroke="#9eb4c7"/><text x="307" y="136" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">単結晶を成長</text><path d="M399,218 H415" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><rect x="425" y="109" width="164" height="223" rx="3" fill="#f6f9fc" stroke="#9eb4c7"/><text x="507" y="136" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">薄く切断</text><path d="M599,218 H615" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><rect x="625" y="109" width="164" height="223" rx="3" fill="#f6f9fc" stroke="#9eb4c7"/><text x="707" y="136" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">表面・品質を整える</text><path d="M52,213 L67,184 L90,197 L100,231 L70,239 Z" stroke="#173657" fill="#a4b4c2" stroke-width="2"/><path d="M106,205 L131,176 L156,199 L149,231 L119,237 Z" stroke="#173657" fill="#bdcad5" stroke-width="2"/><text x="107" y="272" font-size="13" text-anchor="middle" fill="#173657">Si／SiC／III–V等</text><text x="107" y="295" font-size="12" text-anchor="middle" fill="#536478">材料系ごとに原料が異なる</text><rect x="270" y="180" width="74" height="82" rx="0" fill="#8194a6" stroke="#173657"/><ellipse cx="307" cy="180" rx="37" ry="12" fill="#a8b8c7" stroke="#173657"/><ellipse cx="307" cy="262" rx="37" ry="12" fill="#8194a6" stroke="#173657"/><text x="307" y="291" font-size="13" text-anchor="middle" fill="#173657">成長方式を選ぶ</text><text x="307" y="312" font-size="12" text-anchor="middle" fill="#536478">CZ・FZ・PVT・VGF等</text><rect x="455" y="190" width="100" height="58" rx="0" fill="#8194a6" stroke="#173657"/><ellipse cx="455" cy="219" rx="14" ry="29" fill="#acbcc9" stroke="#173657"/><ellipse cx="555" cy="219" rx="14" ry="29" fill="#acbcc9" stroke="#173657"/><path d="M488,166 V270" stroke="#526f88" fill="none" stroke-width="1"/><path d="M500,166 V270" stroke="#526f88" fill="none" stroke-width="1"/><path d="M512,166 V270" stroke="#526f88" fill="none" stroke-width="1"/><path d="M524,166 V270" stroke="#526f88" fill="none" stroke-width="1"/><text x="507" y="291" font-size="13" text-anchor="middle" fill="#173657">ワイヤソー等</text><text x="507" y="312" font-size="12" text-anchor="middle" fill="#536478">材料・仕様で方式が異なる</text><ellipse cx="707" cy="202" rx="47" ry="14" fill="#d1e5ed" stroke="#173657"/><path d="M666,202 Q707,221 748,202" stroke="#173657" fill="none" stroke-width="2"/><text x="707" y="249" font-size="13" text-anchor="middle" fill="#173657">ラップ・エッチ・研磨</text><text x="707" y="273" font-size="13" text-anchor="middle" fill="#173657">洗浄・検査</text><text x="707" y="310" font-size="12" text-anchor="middle" fill="#536478">平坦性・欠陥・清浄度を管理</text><path d="M799,218 H825 V121 H847" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><path d="M825,218 H847" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><path d="M825,218 V315 H847" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><rect x="850" y="88" width="170" height="66" rx="3" fill="#edf5fa" stroke="#9eb4c7"/><text x="935" y="114" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">裸／polished基板</text><text x="935" y="137" font-size="12" text-anchor="middle" fill="#173657">追加エピなしの製品</text><path d="M1021,121 H1038" stroke="#1769aa" fill="none" stroke-width="1.5"/><rect x="850" y="185" width="170" height="66" rx="3" fill="#edf5fa" stroke="#9eb4c7"/><text x="935" y="211" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">エピ基板</text><text x="935" y="234" font-size="12" text-anchor="middle" fill="#173657">基板上へ結晶層を追加</text><path d="M1021,218 H1038" stroke="#1769aa" fill="none" stroke-width="1.5"/><rect x="850" y="282" width="170" height="66" rx="3" fill="#edf5fa" stroke="#9eb4c7"/><text x="935" y="308" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">SOI等の複合構造</text><text x="935" y="331" font-size="12" text-anchor="middle" fill="#173657">接合・層分離などで形成</text><path d="M1021,315 H1038" stroke="#1769aa" fill="none" stroke-width="1.5"/><path d="M1038,121 V315 M1038,218 H1052" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><rect x="1055" y="176" width="77" height="85" rx="0" fill="#dce7f0" stroke="#173657"/><path d="M1066,185 H1120 V200 H1066 Z" stroke="#173657" fill="#b8d0df" stroke-width="1"/><text x="1094" y="221" font-size="12" text-anchor="middle" fill="#173657">デバイス</text><text x="1094" y="242" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">Fab</text><text x="28" y="368" font-size="17" text-anchor="start" fill="#173657" font-weight="700">同じ工程の中でも「装置・材料・部品・用役」を分ける</text><rect x="28" y="385" width="266" height="91" rx="3" fill="#edf4fb" stroke="#9eb4c7"/><text x="41" y="410" font-size="15" text-anchor="start" fill="#173657" font-weight="700">設備</text><text x="41" y="437" font-size="12" text-anchor="start" fill="#173657">結晶成長炉・ワイヤソー</text><text x="41" y="459" font-size="12" text-anchor="start" fill="#173657">研磨・洗浄・検査装置</text><rect x="310" y="385" width="266" height="91" rx="3" fill="#fff7e6" stroke="#9eb4c7"/><text x="323" y="410" font-size="15" text-anchor="start" fill="#173657" font-weight="700">材料</text><text x="323" y="437" font-size="12" text-anchor="start" fill="#173657">高純度原料・砥粒・スラリー</text><text x="323" y="459" font-size="12" text-anchor="start" fill="#173657">エッチング薬液・洗浄薬液</text><rect x="592" y="385" width="266" height="91" rx="3" fill="#f2edf9" stroke="#9eb4c7"/><text x="605" y="410" font-size="15" text-anchor="start" fill="#173657" font-weight="700">部品・治具</text><text x="605" y="437" font-size="12" text-anchor="start" fill="#173657">石英るつぼ・黒鉛ホットゾーン</text><text x="605" y="459" font-size="12" text-anchor="start" fill="#173657">保持治具（方式で搭載は異なる）</text><rect x="874" y="385" width="266" height="91" rx="3" fill="#edf8f3" stroke="#9eb4c7"/><text x="887" y="410" font-size="15" text-anchor="start" fill="#173657" font-weight="700">施設・用役</text><text x="887" y="437" font-size="12" text-anchor="start" fill="#173657">電力・冷却水・ガス供給</text><text x="887" y="459" font-size="12" text-anchor="start" fill="#173657">排気・除害・空調</text><text x="28" y="506" font-size="12" text-anchor="start" fill="#536478">材料系、口径、製品構造、結晶成長方式は別の分類軸。図は代表的な役割の接続で、実寸・歩留まり・特定社の製造レシピではない。</text></g></svg>
