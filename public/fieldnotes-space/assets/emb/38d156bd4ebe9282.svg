<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" role="img" aria-labelledby="title desc"><title id="title">縦型炉：ウェーハを保持して熱処理</title><desc id="desc">ボートに保持したウェーハを処理管内へ。加熱と雰囲気を制御する。酸化は膜形成、アニールは目的に応じた熱処理。 引出線の番号は部品表に対応。模式図・実寸ではない。 処理管内のボートとウェーハの位置を示すため、石英処理管を説明上の透視表示。実機の断面や石英の光学的な透過率を示すものではない。</desc><rect width="840" height="450" fill="#f5f8fb"/><text x="20" y="30" font-size="16" fill="#142438">縦型炉：ウェーハを保持して熱処理</text><polygon points="471.8,289.9 498.0,283.1 498.0,252.2 471.8,259.0" fill="#8bb9b3" stroke="white" stroke-width="1"/><polygon points="498.0,283.1 517.9,292.1 517.9,261.2 498.0,252.2" fill="#8bb9b3" stroke="white" stroke-width="1"/><polygon points="471.8,289.9 498.0,283.1 517.9,292.1 491.7,298.9" fill="#8bb9b3" stroke="white" stroke-width="1"/><polygon points="471.8,259.0 498.0,252.2 517.9,261.2 491.7,268.0" fill="#8bb9b3" stroke="white" stroke-width="1"/><polygon points="471.8,289.9 491.7,298.9 491.7,268.0 471.8,259.0" fill="#8bb9b3" stroke="white" stroke-width="1"/><polygon points="491.7,298.9 517.9,292.1 517.9,261.2 491.7,268.0" fill="#8bb9b3" stroke="white" stroke-width="1"/><polygon points="411.1,295.4 429.5,295.4 429.5,96.7 411.1,96.7" fill="#b2cbd2" fill-opacity="0.12" stroke="#b2cbd2" stroke-width="1" stroke-dasharray="4 3"/><polygon points="393.3,297.0 411.1,295.4 411.1,96.7 393.3,98.3" fill="#b2cbd2" fill-opacity="0.12" stroke="#b2cbd2" stroke-width="1" stroke-dasharray="4 3"/><polygon points="429.5,295.4 447.3,297.0 447.3,98.4 429.5,96.7" fill="#b2cbd2" fill-opacity="0.12" stroke="#b2cbd2" stroke-width="1" stroke-dasharray="4 3"/><polygon points="377.3,300.1 393.3,297.0 393.3,98.3 377.3,101.4" fill="#b2cbd2" fill-opacity="0.12" stroke="#b2cbd2" stroke-width="1" stroke-dasharray="4 3"/><polygon points="447.3,297.0 463.2,300.2 463.2,101.5 447.3,98.4" fill="#b2cbd2" fill-opacity="0.12" stroke="#b2cbd2" stroke-width="1" stroke-dasharray="4 3"/><polygon points="364.3,304.5 377.3,300.1 377.3,101.4 364.3,105.9" fill="#b2cbd2" fill-opacity="0.12