<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 530" role="img" aria-labelledby="wafer-title wafer-desc"><title id="wafer-title">CZ・MCZ・FZ・PVT・VGF・LECの結晶成長原理</title><desc id="wafer-desc">CZはるつぼ内の融液から引き上げ、MCZは磁場で融液の流れを制御。FZはるつぼなしの溶融帯。SiC PVTは原料の昇華と種結晶への気相成長。VGFは温度勾配で凝固。LECは液体封止下で引き上げる。</desc><defs><marker id="wafer-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1769aa"/></marker></defs><rect width="1160" height="530" fill="#fff"/><g font-family="Arimo, Noto Sans JP, sans-serif" fill="#173657"><text x="28" y="30" font-size="20" text-anchor="start" fill="#173657" font-weight="700">結晶成長方式：融液から引く／溶融帯を動かす／昇華させる／凝固させる</text><text x="28" y="56" font-size="14" text-anchor="start" fill="#536478">材料系・設備原理・成長方式を対応付ける。各方式の用途や採用比率を、この図から推定しない。</text><rect x="22" y="82" width="212" height="344" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="128" y="112" font-size="18" text-anchor="middle" fill="#173657" font-weight="700">CZ / MCZ</text><text x="128" y="136" font-size="12" text-anchor="middle" fill="#173657">主にSiの代表例</text><path d="M57,241 V310 Q128,338 199,310 V241" stroke="#173657" fill="#d5dee5" stroke-width="2"/><path d="M65,263 V306 Q128,327 191,306 V263 Z" stroke="#173657" fill="#efad54" stroke-width="1"/><rect x="110" y="175" width="36" height="100" rx="0" fill="#71ae96" stroke="#173657"/><path d="M128,175 V153" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><text x="128" y="352" font-size="13" text-anchor="middle" fill="#173657">融液から引き上げる</text><text x="128" y="376" font-size="12" text-anchor="middle" fill="#173657">MCZ：磁場で融液の</text><text x="128" y="395" font-size="12" text-anchor="middle" fill="#173657">流れを制御するCZ</text><rect x="250" y="82" width="212" height="344" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="356" y="112" font-size="18" text-anchor="middle" fill="#173657" font-weight="700">FZ</text><text x="356" y="136" font-size="12" text-anchor="middle" fill="#173657">Si：るつぼを使わない</text><rect x="336" y="168" width="40" height="88" rx="0" fill="#8194a6" stroke="#173657"/><ellipse cx="356" cy="261" rx="23" ry="11" fill="#efad54" stroke="#173657"/><rect x="336" y="273" width="40" height="53" rx="0" fill="#71ae96" stroke="#173657"/><path d="M297,253 H328 M384,253 H415 M297,270 H328 M384,270 H415" stroke="#b87533" fill="none" stroke-width="4"/><text x="356" y="188" font-size="11" text-anchor="middle" fill="#fff">原料棒</text><text x="356" y="305" font-size="11" text-anchor="middle" fill="#173657">結晶</text><path d="M415,310 V289" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><text x="356" y="352" font-size="13" text-anchor="middle" fill="#173657">棒の一部だけを溶融</text><text x="356" y="376" font-size="12" text-anchor="middle" fill="#173657">溶融帯の相対移動で成長</text><text x="356" y="395" font-size="12" text-anchor="middle" fill="#173657">融液はるつぼと接触しない</text><rect x="478" y="82" width="212" height="344" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="584" y="112" font-size="18" text-anchor="middle" fill="#173657" font-weight="700">PVT</text><text x="584" y="136" font-size="12" text-anchor="middle" fill="#173657">SiC：昇華・気相輸送</text><rect x="520" y="169" width="128" height="160" rx="5" fill="#526679" stroke="#173657"/><rect x="536" y="185" width="96" height="20" rx="0" fill="#71ae96" stroke="#173657"/><text x="584" y="199" font-size="11" text-anchor="middle" fill="#173657">種結晶</text><rect x="536" y="273" width="96" height="37" rx="0" fill="#8c8b86" stroke="#173657"/><text x="584" y="297" font-size="12" text-anchor="middle" fill="#fff">SiC原料</text><path d="M560,260 V216" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><path d="M608,260 V216" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><text x="584" y="242" font-size="11" text-anchor="middle" fill="#fff">気相</text><text x="584" y="352" font-size="13" text-anchor="middle" fill="#173657">原料を昇華させる</text><text x="584" y="376" font-size="12" text-anchor="middle" fill="#173657">気相輸送 → 種結晶へ成長</text><text x="584" y="395" font-size="12" text-anchor="middle" fill="#173657">黒鉛容器・温度勾配を利用</text><rect x="706" y="82" width="212" height="344" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="812" y="112" font-size="18" text-anchor="middle" fill="#173657" font-weight="700">VGF</text><text x="812" y="136" font-size="12" text-anchor="middle" fill="#173657">GaAs / InP等</text><path d="M763,181 V308 L797,330 H827 L861,308 V181" stroke="#173657" fill="#d5dee5" stroke-width="2"/><rect x="771" y="195" width="82" height="75" rx="0" fill="#efad54" stroke="#173657"/><rect x="771" y="270" width="82" height="37" rx="0" fill="#71ae96" stroke="#173657"/><path d="M771,307 L797,326 H827 L853,307" stroke="#173657" fill="#71ae96" stroke-width="1"/><path d="M881,307 V248" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><text x="812" y="238" font-size="13" text-anchor="middle" fill="#173657">融液</text><text x="812" y="293" font-size="12" text-anchor="middle" fill="#173657">結晶</text><text x="812" y="352" font-size="13" text-anchor="middle" fill="#173657">温度勾配下で順に凝固</text><text x="812" y="376" font-size="12" text-anchor="middle" fill="#173657">るつぼ内で結晶を育てる</text><text x="812" y="395" font-size="12" text-anchor="middle" fill="#173657">引上げ方式とは区別</text><rect x="934" y="82" width="212" height="344" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="1040" y="112" font-size="18" text-anchor="middle" fill="#173657" font-weight="700">LEC</text><text x="1040" y="136" font-size="12" text-anchor="middle" fill="#173657">GaAs / InP等</text><path d="M969,241 V310 Q1040,338 1111,310 V241" stroke="#173657" fill="#d5dee5" stroke-width="2"/><path d="M977,263 V306 Q1040,327 1103,306 V263 Z" stroke="#173657" fill="#efad54" stroke-width="1"/><rect x="1022" y="175" width="36" height="100" rx="0" fill="#71ae96" stroke="#173657"/><path d="M1040,175 V153" stroke="#1769aa" fill="none" stroke-width="2" marker-end="url(#wafer-arrow)"/><rect x="977" y="249" width="126" height="13" rx="0" fill="#badff1" stroke="#599bbd"/><rect x="1022" y="249" width="36" height="13" fill="#71ae96" stroke="#173657" stroke-width="1"/><text x="1040" y="352" font-size="13" text-anchor="middle" fill="#173657">液体封止層を通して引上げ</text><text x="1040" y="376" font-size="12" text-anchor="middle" fill="#173657">揮発性成分の損失を抑える</text><text x="1040" y="395" font-size="12" text-anchor="middle" fill="#173657">るつぼ内の融液を使用</text><text x="28" y="457" font-size="13" text-anchor="start" fill="#536478">図の読み方：橙＝融液、緑＝結晶、灰＝原料棒・容器など。PVTのSiC原料は融液ではない。</text><text x="28" y="483" font-size="12" text-anchor="start" fill="#536478">LECの液体封止とVGFの温度勾配は別の要素で、実装では組み合わせもある。GaNのHVPE・アモノサーマル等は別方式で、この図では省略。</text><text x="28" y="507" font-size="12" text-anchor="start" fill="#536478">すべて原理模式図。炉内の実寸、温度・圧力、種結晶の形、結晶成長速度、メーカー固有の設計を再現しない。</text></g></svg>
