<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 910" role="img" aria-labelledby="backend-title backend-desc"><title id="backend-title">後工程・実装・電気検査の全体フローと方式別分岐</title><desc id="backend-desc">代表的な個片組立フロー、W2WとD2Wの接合順序、RDL-firstとRDL-lastの違いを区別。基板製造・前工程と実装の供給境界を示す。</desc><metadata>{&quot;type&quot;: &quot;original technical schematic&quot;, &quot;source_ids&quot;: [&quot;BE_VIS_AMKOR_TEST&quot;, &quot;BE_VIS_DISCO_DBG&quot;, &quot;BE_VIS_TSMC_SOIC&quot;, &quot;BE_VIS_SKH_KGD&quot;, &quot;BE_VIS_ASE_FANOUT&quot;, &quot;BE_VIS_BESI_HYBRID&quot;], &quot;limitations&quot;: [&quot;Not to scale&quot;, &quot;Not a real manufacturing recipe&quot;, &quot;Dimensions, layer counts, bump counts and die counts are illustrative&quot;]}</metadata><defs><marker id="backend-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1769aa"/></marker></defs><rect width="1420" height="910" fill="#fff"/><g font-family="Arimo, Noto Sans JP, sans-serif" fill="#173657"><text x="28" y="32" font-size="24" text-anchor="start" fill="#173657" font-weight="700">後工程・実装・電気検査：工程は接続方式と製品で分岐する</text><text x="28" y="61" font-size="16" text-anchor="start" fill="#536478">上段はダイを個片化して組み立てる代表例。W2W、D2W、Fan-outでは接合・薄化・配線形成の順序が変わる。</text><rect x="24" y="82" width="151" height="36" rx="3" fill="#eef2f6" stroke="#a9bdce"/><text x="100" y="106" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">③前工程から</text><rect x="212" y="82" width="1185" height="36" rx="3" fill="#eaf3fa" stroke="#a9bdce"/><text x="230" y="106" font-size="15" text-anchor="start" fill="#173657" font-weight="700">④ 今回の機能別索引：組立・実装・電気検査（番号は加工順序を固定しない）</text><rect x="25" y="145" width="150" height="139" rx="4" fill="#f7fafc" stroke="#a9bdce"/><text x="100.0" y="171" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">前工程済み</text><text x="100.0" y="194" font-size="15" text-anchor="middle" fill="#173657">ウェーハ</text><path d="M182,214 H210" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><rect x="218" y="145" width="165" height="139" rx="4" fill="#f7fafc" stroke="#a9bdce"/><text x="300.5" y="171" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">15 電気検査</text><text x="300.5" y="194" font-size="15" text-anchor="middle" fill="#173657">KGD判定等</text><path d="M390,214 H410" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><rect x="418" y="145" width="165" height="139" rx="4" fill="#f7fafc" stroke="#a9bdce"/><text x="500.5" y="171" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">16・17</text><text x="500.5" y="194" font-size="15" text-anchor="middle" fill="#173657">薄化・個片化</text><path d="M590,214 H610" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><rect x="618" y="145" width="216" height="139" rx="4" fill="#f7fafc" stroke="#a9bdce"/><text x="726.0" y="171" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">18・19</text><text x="726.0" y="194" font-size="15" text-anchor="middle" fill="#173657">接合・電気接続</text><path d="M841,214 H861" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><rect x="869" y="145" width="156" height="139" rx="4" fill="#f7fafc" stroke="#a9bdce"/><text x="947.0" y="171" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">20 封止等</text><text x="947.0" y="194" font-size="15" text-anchor="middle" fill="#173657">保護・充填</text><path d="M1032,214 H1052" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><rect x="1060" y="145" width="156" height="139" rx="4" fill="#f7fafc" stroke="#a9bdce"/><text x="1138.0" y="171" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">21 最終ATE</text><text x="1138.0" y="194" font-size="15" text-anchor="middle" fill="#173657">電気特性を確認</text><path d="M1223,214 H1243" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)" stroke-dasharray="5 4"/><rect x="1251" y="145" width="146" height="139" rx="4" fill="#fff9ed" stroke="#a9bdce" stroke-dasharray="6 4"/><text x="1324.0" y="171" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">Burn-in / SLT</text><text x="1324.0" y="194" font-size="15" text-anchor="middle" fill="#173657">仕様に応じ選択</text><ellipse cx="100" cy="242" rx="40" ry="12" fill="#8194a6" stroke="#173657"/><path d="M77,232 V252 M100,230 V254 M123,232 V252" fill="none" stroke="#dce4eb" stroke-width="1"/><ellipse cx="301" cy="245" rx="43" ry="11" fill="#b1bfcd" stroke="#173657"/><path d="M277,213 V237" fill="none" stroke="#54738b" stroke-width="1.5"/><path d="M289,213 V237" fill="none" stroke="#54738b" stroke-width="1.5"/><path d="M301,213 V237" fill="none" stroke="#54738b" stroke-width="1.5"/><path d="M313,213 V237" fill="none" stroke="#54738b" stroke-width="1.5"/><path d="M325,213 V237" fill="none" stroke="#54738b" stroke-width="1.5"/><text x="301" y="272" font-size="12" text-anchor="middle" fill="#173657">検査済みダイを識別</text><ellipse cx="500" cy="235" rx="37" ry="9" fill="#8194a6" stroke="#173657"/><ellipse cx="500" cy="247" rx="37" ry="9" fill="#8194a6" stroke="#173657"/><path d="M475,219 L523,256 M492,216 L540,253" fill="none" stroke="#cf6d56" stroke-width="2"/><text x="500" y="273" font-size="12" text-anchor="middle" fill="#173657">順序はDBG等で変わる</text><rect x="656" y="252" width="139" height="11" rx="0" fill="#76a68e" stroke="#173657"/><rect x="668" y="217" width="45" height="25" rx="0" fill="#8194a6" stroke="#173657"/><rect x="739" y="217" width="45" height="25" rx="0" fill="#8194a6" stroke="#173657"/><circle cx="680" cy="248" r="4" fill="#b67443" stroke="#5c7185"/><circle cx="700" cy="248" r="4" fill="#b67443" stroke="#5c7185"/><circle cx="751" cy="248" r="4" fill="#b67443" stroke="#5c7185"/><circle cx="771" cy="248" r="4" fill="#b67443" stroke="#5c7185"/><text x="726" y="274" font-size="12" text-anchor="middle" fill="#173657">ワイヤ／バンプ／直接接合</text><rect x="895" y="218" width="102" height="39" rx="3" fill="#e9e5dc" stroke="#173657"/><rect x="925" y="232" width="43" height="18" rx="0" fill="#8194a6" stroke="#173657"/><text x="947" y="273" font-size="12" text-anchor="middle" fill="#173657">封止を使わない構造も</text><rect x="1090" y="220" width="97" height="36" rx="0" fill="#dbe9f4" stroke="#173657"/><rect x="1116" y="226" width="44" height="24" rx="0" fill="#8194a6" stroke="#173657"/><path d="M1113,213 V220 M1113,256 V263" fill="none" stroke="#54738b" stroke-width="1.2"/><path d="M1126,213 V220 M1126,256 V263" fill="none" stroke="#54738b" stroke-width="1.2"/><path d="M1139,213 V220 M1139,256 V263" fill="none" stroke="#54738b" stroke-width="1.2"/><path d="M1152,213 V220 M1152,256 V263" fill="none" stroke="#54738b" stroke-width="1.2"/><path d="M1165,213 V220 M1165,256 V263" fill="none" stroke="#54738b" stroke-width="1.2"/><rect x="1278" y="218" width="92" height="41" rx="0" fill="#fff4d7" stroke="#173657"/><text x="1324" y="245" font-size="13" text-anchor="middle" fill="#173657">温度・動作</text><path d="M1324,145 V128 H1138 V145" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)" stroke-dasharray="5 4"/><text x="1240" y="334" font-size="13" text-anchor="middle" fill="#536478">必要に応じストレス前後に電気テスト</text><text x="27" y="329" font-size="14" text-anchor="start" fill="#536478">KGD = Known Good Die：指定の電気テスト条件で良品と判定したダイ。未検出不良がゼロという保証ではない。</text><rect x="25" y="358" width="1372" height="188" rx="4" fill="#f2f7fb" stroke="#a9bdce"/><text x="43" y="384" font-size="18" text-anchor="start" fill="#173657" font-weight="700">ウェーハレベルで接合する分岐</text><text x="44" y="424" font-size="18" text-anchor="start" fill="#173657" font-weight="700">W2W</text><text x="44" y="447" font-size="13" text-anchor="start" fill="#173657">前工程済ウェーハ同士</text><ellipse cx="258" cy="411" rx="49" ry="9" fill="#8194a6" stroke="#173657"/><ellipse cx="258" cy="427" rx="49" ry="9" fill="#8194a6" stroke="#173657"/><path d="M317,420 H350" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="438" y="425" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">ウェーハ接合</text><path d="M520,420 H555" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="665" y="425" font-size="16" text-anchor="middle" fill="#173657">薄化・裏面接続等</text><path d="M779,420 H820" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="912" y="425" font-size="16" text-anchor="middle" fill="#173657">個片化</text><text x="1070" y="416" font-size="14" text-anchor="start" fill="#173657">必要な組立を経て</text><text x="1070" y="440" font-size="14" text-anchor="start" fill="#173657">電気検査へ接続</text><path d="M970,420 H1035" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><path d="M1218,420 H1236 V268 H1216" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)" stroke-dasharray="5 4"/><text x="44" y="498" font-size="18" text-anchor="start" fill="#173657" font-weight="700">D2W</text><text x="44" y="522" font-size="13" text-anchor="start" fill="#173657">検査・個片化済ダイ</text><rect x="244" y="469" width="28" height="16" rx="0" fill="#8194a6" stroke="#173657"/><ellipse cx="258" cy="509" rx="49" ry="9" fill="#8194a6" stroke="#173657"/><path d="M258,488 V497" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><path d="M317,498 H350" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="438" y="503" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">KGD等を選んで接合</text><path d="M545,498 H580" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="698" y="503" font-size="15" text-anchor="middle" fill="#173657">方式に応じ薄化・個片化</text><path d="M841,498 H875" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="1025" y="503" font-size="16" text-anchor="middle" fill="#173657">次の組立・電気検査へ</text><text x="44" y="541" font-size="13" fill="#173657">＋受け側ウェーハ</text><path d="M1180,498 H1236 V420" fill="none" stroke="#1769aa" stroke-width="2" stroke-dasharray="5 4"/><text x="43" y="570" font-size="18" text-anchor="start" fill="#173657" font-weight="700">Fan-outのRDL形成は、ダイ配置より先にも後にも来る</text><rect x="25" y="597" width="1372" height="49" rx="3" fill="#fbfcfe" stroke="#a9bdce"/><text x="43" y="627" font-size="15" text-anchor="start" fill="#173657" font-weight="700">RDL-first / chip-last</text><text x="500" y="627" font-size="16" text-anchor="middle" fill="#173657">キャリア上にRDL形成</text><path d="M630,621 H690" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="825" y="627" font-size="16" text-anchor="middle" fill="#173657">ダイを接合</text><path d="M955,621 H1015" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="1150" y="627" font-size="16" text-anchor="middle" fill="#173657">封止・離型など</text><rect x="25" y="660" width="1372" height="49" rx="3" fill="#fbfcfe" stroke="#a9bdce"/><text x="43" y="690" font-size="15" text-anchor="start" fill="#173657" font-weight="700">Chip-first / RDL-last</text><text x="500" y="690" font-size="16" text-anchor="middle" fill="#173657">キャリアへダイ配置</text><path d="M630,684 H690" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="825" y="690" font-size="16" text-anchor="middle" fill="#173657">封止・再構成</text><path d="M955,684 H1015" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#backend-arrow)"/><text x="1150" y="690" font-size="16" text-anchor="middle" fill="#173657">RDL形成など</text><text x="43" y="735" font-size="14" text-anchor="start" fill="#536478">RDL形成には成膜・露光・めっき等を使う。薄化、接合、封止、検査の前後関係は方式・製品で異なる。</text><rect x="25" y="758" width="1372" height="96" rx="4" fill="#faf7ef" stroke="#a9bdce"/><text x="43" y="784" font-size="17" text-anchor="start" fill="#173657" font-weight="700">境界を分ける</text><text x="43" y="811" font-size="14" text-anchor="start" fill="#173657">裸ウェーハの製造 → 前工程で素子・配線を形成 → 本図の組立・実装へ。パッケージ基板・リードフレーム・インターポーザーの製造は別の供給製品・工程。</text><text x="43" y="837" font-size="14" text-anchor="start" fill="#173657">接合の一部は前工程の精度・装置群を利用し、企業がfront-end 3D stackingと呼ぶ領域も含む。装置・材料・部品の市場金額を工程順に合算しない。</text><text x="27" y="886" font-size="14" text-anchor="start" fill="#536478">工程の機能を説明する編集模式図。実寸・数量・実際のレシピ・全品に共通する必須工程を表さない。KGD、ATE、burn-in、SLTは対象と条件が異なる。</text></g></svg>
