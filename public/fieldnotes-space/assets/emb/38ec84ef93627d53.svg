<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 940" role="img" aria-labelledby="backend-title backend-desc"><title id="backend-title">半導体パッケージ5方式の断面と電気接続</title><desc id="backend-desc">ワイヤボンド、フリップチップFC-BGA、Fan-out RDL、全面インターポーザーと局所ブリッジの2.5D、TSVとハイブリッド接合を組み合わせた3Dの模式断面。</desc><metadata>{&quot;type&quot;: &quot;original technical schematic&quot;, &quot;source_ids&quot;: [&quot;BE_VIS_AMKOR_FLIPCHIP&quot;, &quot;BE_VIS_AMKOR_WLFO&quot;, &quot;BE_VIS_TSMC_COWOS&quot;, &quot;BE_VIS_INTEL_PACKAGING&quot;, &quot;BE_VIS_ASE_FANOUT&quot;, &quot;BE_VIS_BESI_HYBRID&quot;, &quot;BE_VIS_ASE_LEADFRAME&quot;], &quot;limitations&quot;: [&quot;Not to scale&quot;, &quot;Not a real manufacturing recipe&quot;, &quot;Dimensions, layer counts, bump counts and die counts are illustrative&quot;]}</metadata><defs><marker id="backend-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1769aa"/></marker></defs><rect width="1420" height="940" fill="#fff"/><g font-family="Arimo, Noto Sans JP, sans-serif" fill="#173657"><text x="28" y="32" font-size="24" text-anchor="start" fill="#173657" font-weight="700">パッケージの断面：どこでチップをつなぎ、どこを支えるか</text><text x="28" y="61" font-size="16" text-anchor="start" fill="#536478">接続構造・積層方式の例。材料名、装置名、用役設備、交換部品は別の分類軸。図の層厚・接続数・ダイ数は実数ではない。</text><rect x="25" y="87" width="430" height="322" rx="4" fill="#f8fafc" stroke="#a9bdce"/><text x="240" y="118" font-size="19" text-anchor="middle" fill="#173657" font-weight="700">1. ワイヤボンド</text><rect x="495" y="87" width="430" height="322" rx="4" fill="#f8fafc" stroke="#a9bdce"/><text x="710" y="118" font-size="19" text-anchor="middle" fill="#173657" font-weight="700">2. フリップチップ FC-BGA</text><rect x="965" y="87" width="430" height="322" rx="4" fill="#f8fafc" stroke="#a9bdce"/><text x="1180" y="118" font-size="19" text-anchor="middle" fill="#173657" font-weight="700">3. Fan-out RDL</text><rect x="61" y="163" width="358" height="156" rx="6" fill="#e9e5dc" stroke="#b8b1a3"/><rect x="45" y="297" width="85" height="15" rx="0" fill="#b67443" stroke="#173657"/><rect x="175" y="297" width="130" height="15" rx="0" fill="#b67443" stroke="#173657"/><rect x="350" y="297" width="85" height="15" rx="0" fill="#b67443" stroke="#173657"/><rect x="179" y="281" width="122" height="15" rx="0" fill="#d3bc8d" stroke="#173657"/><rect x="179" y="228" width="122" height="53" rx="0" fill="#8194a6" stroke="#173657"/><text x="240" y="260" font-size="15" text-anchor="middle" fill="#fff">Siダイ</text><path d="M186,230 Q133,159 101,296" fill="none" stroke="#b28a30" stroke-width="3"/><path d="M294,230 Q347,159 378,296" fill="none" stroke="#b28a30" stroke-width="3"/><text x="240" y="343" font-size="14" text-anchor="middle" fill="#173657">ワイヤが電気接続、接着材がダイを保持</text><text x="240" y="370" font-size="14" text-anchor="middle" fill="#536478">リードフレーム型の代表例</text><rect x="533" y="294" width="354" height="31" rx="0" fill="#76a68e" stroke="#173657"/><rect x="603" y="187" width="214" height="72" rx="0" fill="#8194a6" stroke="#173657"/><rect x="603" y="259" width="214" height="34" rx="0" fill="#f3dcaf" stroke="#b8a17a"/><text x="710" y="221" font-size="15" text-anchor="middle" fill="#fff">Siダイ（回路面は下）</text><circle cx="621" cy="276" r="8" fill="#b67443" stroke="#5c7185"/><circle cx="652" cy="276" r="8" fill="#b67443" stroke="#5c7185"/><circle cx="683" cy="276" r="8" fill="#b67443" stroke="#5c7185"/><circle cx="714" cy="276" r="8" fill="#b67443" stroke="#5c7185"/><circle cx="745" cy="276" r="8" fill="#b67443" stroke="#5c7185"/><circle cx="776" cy="276" r="8" fill="#b67443" stroke="#5c7185"/><circle cx="553" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="599" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="645" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="691" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="737" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="783" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="829" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="875" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><text x="710" y="368" font-size="14" text-anchor="middle" fill="#173657">バンプ → 有機パッケージ基板 → ボール</text><text x="710" y="390" font-size="13" text-anchor="middle" fill="#536478">ダイ下の充填材＝アンダーフィルの例</text><rect x="1000" y="171" width="360" height="119" rx="3" fill="#e9e5dc" stroke="#b8b1a3"/><rect x="1097" y="202" width="166" height="88" rx="0" fill="#8194a6" stroke="#173657"/><text x="1180" y="246" font-size="15" text-anchor="middle" fill="#fff">Siダイ</text><rect x="1000" y="290" width="360" height="35" rx="0" fill="#bfdfec" stroke="#173657"/><path d="M1117,289 V302 H1029 V325" fill="none" stroke="#b67443" stroke-width="4"/><path d="M1147,289 V302 H1079 V325" fill="none" stroke="#b67443" stroke-width="4"/><path d="M1213,289 V302 H1281 V325" fill="none" stroke="#b67443" stroke-width="4"/><path d="M1243,289 V302 H1331 V325" fill="none" stroke="#b67443" stroke-width="4"/><circle cx="1029" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1079" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1129" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1231" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1281" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1331" cy="341" r="10" fill="#bcc7d0" stroke="#5c7185"/><text x="1180" y="368" font-size="14" text-anchor="middle" fill="#173657">RDLをダイの外側まで広げる</text><text x="1180" y="390" font-size="13" text-anchor="middle" fill="#536478">別体の有機基板を持たない代表例</text><rect x="25" y="435" width="810" height="343" rx="4" fill="#f8fafc" stroke="#a9bdce"/><text x="45" y="466" font-size="19" text-anchor="start" fill="#173657" font-weight="700">4. 2.5D：全面インターポーザー／局所ブリッジ</text><text x="225" y="500" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">全面Siインターポーザーの例</text><text x="615" y="500" font-size="15" text-anchor="middle" fill="#173657" font-weight="700">局所Siブリッジの例</text><rect x="75" y="643" width="302" height="27" rx="0" fill="#76a68e" stroke="#173657"/><rect x="75" y="602" width="302" height="24" rx="0" fill="#aa99c7" stroke="#173657"/><rect x="104" y="602" width="7" height="24" rx="0" fill="#b67443" stroke="#173657"/><circle cx="107" cy="635" r="6" fill="#b67443" stroke="#5c7185"/><rect x="155" y="602" width="7" height="24" rx="0" fill="#b67443" stroke="#173657"/><circle cx="158" cy="635" r="6" fill="#b67443" stroke="#5c7185"/><rect x="303" y="602" width="7" height="24" rx="0" fill="#b67443" stroke="#173657"/><circle cx="306" cy="635" r="6" fill="#b67443" stroke="#5c7185"/><rect x="352" y="602" width="7" height="24" rx="0" fill="#b67443" stroke="#173657"/><circle cx="355" cy="635" r="6" fill="#b67443" stroke="#5c7185"/><rect x="96" y="532" width="105" height="55" rx="0" fill="#8194a6" stroke="#173657"/><circle cx="113" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><circle cx="147" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><circle cx="181" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><rect x="248" y="532" width="105" height="55" rx="0" fill="#8194a6" stroke="#173657"/><circle cx="265" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><circle cx="299" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><circle cx="333" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><path d="M154,613 H303" fill="none" stroke="#b67443" stroke-width="3"/><text x="149" y="562" font-size="14" text-anchor="middle" fill="#fff">ダイA</text><text x="301" y="562" font-size="14" text-anchor="middle" fill="#fff">ダイB</text><circle cx="97" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="139" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="181" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="223" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="265" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="307" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="349" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><text x="226" y="716" font-size="14" text-anchor="middle" fill="#173657">Si層の横配線＋縦方向の接続</text><text x="226" y="742" font-size="12" text-anchor="middle" fill="#536478">インターポーザーは有機RDL等もある</text><rect x="465" y="600" width="302" height="70" rx="0" fill="#76a68e" stroke="#173657"/><rect x="566" y="600" width="100" height="24" rx="0" fill="#aa99c7" stroke="#173657"/><rect x="486" y="532" width="105" height="55" rx="0" fill="#8194a6" stroke="#173657"/><circle cx="503" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><circle cx="537" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><circle cx="571" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><rect x="638" y="532" width="105" height="55" rx="0" fill="#8194a6" stroke="#173657"/><circle cx="655" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><circle cx="689" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><circle cx="723" cy="594" r="5" fill="#b67443" stroke="#5c7185"/><path d="M579,612 H653" fill="none" stroke="#b67443" stroke-width="3"/><text x="539" y="562" font-size="14" text-anchor="middle" fill="#fff">ダイA</text><text x="691" y="562" font-size="14" text-anchor="middle" fill="#fff">ダイB</text><circle cx="487" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="529" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="571" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="613" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="655" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="697" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="739" cy="684" r="8" fill="#bcc7d0" stroke="#5c7185"/><text x="616" y="716" font-size="14" text-anchor="middle" fill="#173657">チップ間を小さなSi片でつなぐ</text><text x="616" y="742" font-size="12" text-anchor="middle" fill="#536478">全域のSiインターポーザーと区別</text><rect x="860" y="435" width="535" height="343" rx="4" fill="#f8fafc" stroke="#a9bdce"/><text x="880" y="466" font-size="19" text-anchor="start" fill="#173657" font-weight="700">5. 3D：ハイブリッド接合＋TSVの例</text><rect x="965" y="651" width="315" height="24" rx="0" fill="#76a68e" stroke="#173657"/><rect x="987" y="577" width="271" height="62" rx="0" fill="#8194a6" stroke="#173657"/><rect x="1021" y="502" width="203" height="64" rx="0" fill="#8194a6" stroke="#173657"/><rect x="1021" y="566" width="203" height="11" rx="0" fill="#bfdfec" stroke="#173657"/><rect x="1058" y="566" width="12" height="11" rx="0" fill="#b67443" stroke="#173657"/><rect x="1106" y="566" width="12" height="11" rx="0" fill="#b67443" stroke="#173657"/><rect x="1178" y="566" width="12" height="11" rx="0" fill="#b67443" stroke="#173657"/><rect x="1200" y="566" width="12" height="11" rx="0" fill="#b67443" stroke="#173657"/><rect x="1134" y="566" width="12" height="11" fill="#b67443" stroke="#173657"/><rect x="1060" y="502" width="9" height="64" rx="0" fill="#b67443" stroke="#173657"/><rect x="1180" y="502" width="9" height="64" rx="0" fill="#b67443" stroke="#173657"/><rect x="1136" y="577" width="9" height="62" rx="0" fill="#b67443" stroke="#173657"/><circle cx="1007" cy="645" r="6" fill="#b67443" stroke="#5c7185"/><circle cx="1052" cy="645" r="6" fill="#b67443" stroke="#5c7185"/><circle cx="1097" cy="645" r="6" fill="#b67443" stroke="#5c7185"/><circle cx="1142" cy="645" r="6" fill="#b67443" stroke="#5c7185"/><circle cx="1187" cy="645" r="6" fill="#b67443" stroke="#5c7185"/><circle cx="1232" cy="645" r="6" fill="#b67443" stroke="#5c7185"/><circle cx="990" cy="689" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1040" cy="689" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1090" cy="689" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1140" cy="689" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1190" cy="689" r="8" fill="#bcc7d0" stroke="#5c7185"/><circle cx="1240" cy="689" r="8" fill="#bcc7d0" stroke="#5c7185"/><text x="1123" y="533" font-size="15" text-anchor="middle" fill="#fff">上側Siダイ</text><text x="1123" y="607" font-size="15" text-anchor="middle" fill="#fff">下側Siダイ</text><text x="880" y="720" font-size="14" text-anchor="start" fill="#173657">TSV：Siを貫く縦配線。接合界面はCu＋絶縁膜。</text><text x="880" y="746" font-size="13" text-anchor="start" fill="#536478">TSVなし、マイクロバンプ積層などの別構成もある。</text><rect x="28" y="810" width="16" height="13" rx="0" fill="#8194a6" stroke="#173657"/><text x="53" y="822" font-size="14" text-anchor="start" fill="#173657">Siダイ</text><rect x="498" y="810" width="16" height="13" rx="0" fill="#76a68e" stroke="#173657"/><text x="523" y="822" font-size="14" text-anchor="start" fill="#173657">有機パッケージ基板</text><rect x="968" y="810" width="16" height="13" rx="0" fill="#aa99c7" stroke="#173657"/><text x="993" y="822" font-size="14" text-anchor="start" fill="#173657">Siインターポーザー／ブリッジ</text><rect x="28" y="839" width="16" height="13" rx="0" fill="#bfdfec" stroke="#173657"/><text x="53" y="851" font-size="14" text-anchor="start" fill="#173657">絶縁層／RDL絶縁材</text><rect x="498" y="839" width="16" height="13" rx="0" fill="#b67443" stroke="#173657"/><text x="523" y="851" font-size="14" text-anchor="start" fill="#173657">金属配線・接点</text><rect x="968" y="839" width="16" height="13" rx="0" fill="#e9e5dc" stroke="#173657"/><text x="993" y="851" font-size="14" text-anchor="start" fill="#173657">封止材</text><text x="28" y="885" font-size="14" text-anchor="start" fill="#536478">断面は原理模式図。構造を示すための接点・ボール・層数であり、実BOM、歩留まり、特定製品の設計・寸法を表さない。</text><text x="28" y="913" font-size="14" text-anchor="start" fill="#536478">材料：樹脂・Cu・絶縁材等／装置：接合・露光・めっき・研磨・封止等／用役設備：受配電・冷却・供給設備等／部品：治具・接触子・ノズル等。</text></g></svg>
