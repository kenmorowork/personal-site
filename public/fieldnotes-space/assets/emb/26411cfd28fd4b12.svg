<text x="28" y="867" class="head">建設・設備工事は、これらを設計し、つなぎ、立ち上げる役割</text>
<rect x="28" y="890" width="1384" height="91" rx="4" class="box"/>
<text x="48" y="923" class="bold">計画・設計</text><path d="M179 918H240" class="arrow"/><text x="267" y="923" class="bold">建屋・用役工事</text><path d="M452 918H513" class="arrow"/><text x="540" y="923" class="bold">装置接続・試運転・確認</text><path d="M803 918H864" class="arrow"/><text x="891" y="923" class="bold">稼働・保守・増強</text>
<text x="48" y="959" class="small muted">設備の製品市場、工事・EPC、運転保守は契約範囲を確認。金額を単純に重ねて合計しない。工程は一部並行・反復する。</text>
<path d="M28 1003H1412" class="rule"/><text x="28" y="1030" class="small muted">原理模式図・縮尺なし。方式は工程で異なる。線は機能の接続例で、実機台数・測定点・実際の安全系統を示さない。確認日 2026-10-20 JST</text>
