<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 595" role="img" aria-labelledby="wafer-title wafer-desc"><title id="wafer-title">基板の材料と構造：裸Si・エピSi・SOI・GaN支持基板</title><desc id="wafer-desc">裸Si、Siエピ層上のSi基板、デバイスSiと埋込酸化膜と支持SiからなるSOIを比較。GaNは自立GaN基板とSi、SiC、サファイア上のエピを分ける。</desc><defs><marker id="wafer-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1769aa"/></marker></defs><rect width="1160" height="595" fill="#fff"/><g font-family="Arimo, Noto Sans JP, sans-serif" fill="#173657"><text x="28" y="30" font-size="21" text-anchor="start" fill="#173657" font-weight="700">「材料」と「積層構造」は別の軸で比較する</text><text x="28" y="58" font-size="14" text-anchor="start" fill="#536478">上段：同じSi系で構造を比較。下段：GaN層と、その下の支持基板を区別する。口径は別に指定する。</text><rect x="35" y="88" width="340" height="207" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="205" y="119" font-size="17" text-anchor="middle" fill="#173657" font-weight="700">裸のバルクSi</text><rect x="410" y="88" width="340" height="207" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="580" y="119" font-size="17" text-anchor="middle" fill="#173657" font-weight="700">Siエピ on Si</text><rect x="785" y="88" width="340" height="207" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="955" y="119" font-size="17" text-anchor="middle" fill="#173657" font-weight="700">SOI（Si / BOX / Si）</text><rect x="64" y="167" width="282" height="75" rx="0" fill="#8194a6" stroke="#173657"/><text x="205" y="213" font-size="15" text-anchor="middle" fill="#fff">単結晶Si基板</text><text x="205" y="273" font-size="13" text-anchor="middle" fill="#173657">表面研磨した基板の例</text><rect x="439" y="187" width="282" height="55" rx="0" fill="#8194a6" stroke="#173657"/><rect x="439" y="157" width="282" height="30" rx="0" fill="#71ae96" stroke="#173657"/><text x="580" y="178" font-size="14" text-anchor="middle" fill="#173657">Siエピ層</text><text x="580" y="222" font-size="14" text-anchor="middle" fill="#fff">単結晶Si基板</text><text x="580" y="273" font-size="13" text-anchor="middle" fill="#173657">同じSiでも層の電気特性等を変える</text><rect x="814" y="197" width="282" height="45" rx="0" fill="#8194a6" stroke="#173657"/><rect x="814" y="178" width="282" height="19" rx="0" fill="#badff1" stroke="#173657"/><rect x="814" y="151" width="282" height="27" rx="0" fill="#71ae96" stroke="#173657"/><text x="955" y="169" font-size="13" text-anchor="middle" fill="#173657">デバイスSi層</text><text x="955" y="192" font-size="12" text-anchor="middle" fill="#173657">BOX：埋込酸化膜</text><text x="955" y="225" font-size="13" text-anchor="middle" fill="#fff">支持Si基板</text><text x="955" y="273" font-size="13" text-anchor="middle" fill="#173657">導電するSi層を酸化膜で絶縁</text><text x="28" y="335" font-size="17" text-anchor="start" fill="#173657" font-weight="700">GaNの例：自立GaN基板と、異種基板上のGaNエピを混ぜない</text><rect x="28" y="355" width="266" height="160" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="161" y="383" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">GaN on GaN</text><rect x="46" y="425" width="230" height="56" rx="0" fill="#8676b0" stroke="#173657"/><rect x="46" y="403" width="230" height="22" rx="0" fill="#a493cf" stroke="#173657"/><text x="161" y="419" font-size="12" text-anchor="middle" fill="#173657">GaNエピ層</text><text x="161" y="459" font-size="14" text-anchor="middle" fill="#fff">自立GaN基板</text><rect x="310" y="355" width="266" height="160" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="443" y="383" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">GaN on Si</text><rect x="328" y="425" width="230" height="56" rx="0" fill="#8194a6" stroke="#173657"/><rect x="328" y="403" width="230" height="22" rx="0" fill="#a493cf" stroke="#173657"/><text x="443" y="419" font-size="12" text-anchor="middle" fill="#173657">GaNエピ層</text><text x="443" y="459" font-size="14" text-anchor="middle" fill="#173657">Si基板</text><rect x="592" y="355" width="266" height="160" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="725" y="383" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">GaN on SiC</text><rect x="610" y="425" width="230" height="56" rx="0" fill="#80aac5" stroke="#173657"/><rect x="610" y="403" width="230" height="22" rx="0" fill="#a493cf" stroke="#173657"/><text x="725" y="419" font-size="12" text-anchor="middle" fill="#173657">GaNエピ層</text><text x="725" y="459" font-size="14" text-anchor="middle" fill="#173657">SiC基板</text><rect x="874" y="355" width="266" height="160" rx="3" fill="#f8fafc" stroke="#9eb4c7"/><text x="1007" y="383" font-size="16" text-anchor="middle" fill="#173657" font-weight="700">GaN on sapphire</text><rect x="892" y="425" width="230" height="56" rx="0" fill="#c2b1bf" stroke="#173657"/><rect x="892" y="403" width="230" height="22" rx="0" fill="#a493cf" stroke="#173657"/><text x="1007" y="419" font-size="12" text-anchor="middle" fill="#173657">GaNエピ層</text><text x="1007" y="459" font-size="14" text-anchor="middle" fill="#173657">サファイア基板</text><text x="28" y="548" font-size="12" text-anchor="start" fill="#536478">色は層の区別。薄膜・BOX・基板の厚さ比は実物を表さない。GaNのバッファ層等は省略。native GaNは支持基板がGaNという意味。</text><text x="28" y="573" font-size="12" text-anchor="start" fill="#536478">エピ、SOI、材料系、口径を同じ排他的な市場区分として単純合算しない。各図は構造の代表例。</text></g></svg>
